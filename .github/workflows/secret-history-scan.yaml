# G13 — git-history secret scan, on a schedule.
#
# The CI secret scan (ci.yaml, "security" job) runs `git grep` over the
# WORKING TREE only. Deleting a credential from the tree makes CI green while
# every clone of the repository still contains it. The full-history scan is
# O(commits × tree) — minutes on a repo this size — which is why the script
# deliberately says it is NOT a per-push gate. A weekly scheduled run is the
# right cadence: rotation/decisions have time to land between scans, and a
# failure here is a loud alert (GitHub sends a notification for a failed
# scheduled run) rather than a minutes-long tax on every push.
#
# Run manually with workflow_dispatch anytime ("Run workflow" → branch).
name: Secret history scan

on:
  schedule:
    # Weekly, offset from the hour (CodeQL's own advice: hourly jobs queue).
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-history:
    name: Scan full git history for credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history is the subject of the scan
      - name: Run the history scan
        run: bash scripts/scan-history-secrets.sh
      - name: Post result
        if: always()
        run: echo "Scan complete — a non-zero exit above means credentials were found in history (rotate, then consider a purge)."
