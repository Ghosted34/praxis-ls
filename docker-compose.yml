services:
  postgres:
    # Stock upstream image, deliberately.
    #
    # WAL archiving (WS-B1 layer 2) needs a Node runtime inside THIS container,
    # because archive_command is executed by the Postgres process. Building that
    # here would mean every deploy rebuilds Postgres — pulling from the network
    # on a cold cache, and failing the deploy BEFORE migrations if that network
    # is unreachable — for a feature that is off by default.
    #
    # So it lives in an opt-in overlay instead. To enable WAL archiving:
    #
    #   docker compose -f docker-compose.yml -f docker-compose.wal.yml up -d postgres
    #
    # See docker-compose.wal.yml.
    image: pgvector/pgvector:pg16
    container_name: praxis_postgres
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-praxislsdata}
      POSTGRES_USER: ${DB_USER:-praxis-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    # INCIDENT 2026-08-12 — max_connections was never set here, so Postgres ran
    # on the upstream default of 100 while the app was configured to open up to
    # ~600 (DB_POOL_MAX 10 + TENANT_POOL_MAX 8 × TENANT_POOL_CACHE_MAX 24, across
    # api + api-standby + worker). That gap was invisible until the Kaizen ops
    # health collector began touching every tenant every five minutes and
    # materialising pools that had previously stayed cold; tenant logins then
    # failed in pool acquisition, not with a connection error, which is what made
    # it slow to diagnose.
    #
    # 300 is chosen against the app's own arithmetic, not picked round: it clears
    # the per-process ceiling with the headroom src/config/connection-budget.js
    # requires for migrations, pg_dump, restore drills and a human with psql.
    # That check now runs at boot, so this number and the pool settings cannot
    # drift apart silently again.
    #
    # The real fix for the ceiling is PgBouncer (WS-S1), which is deployed but
    # carries no traffic yet. When TENANT_DB_POOLER_HOST is set, the binding
    # limit becomes PGBOUNCER_MAX_DB_CONNECTIONS and this can come back down.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
    ports:
      # loopback only — never expose Postgres to the public interface
      - "127.0.0.1:5432:5432"
    volumes:
      - praxis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: praxis_redis
    # SEC-L2 — require a password.
    #
    # Redis was unauthenticated, mitigated only by the loopback port binding
    # below. That is a real mitigation and it is also a single line of
    # docker-compose away from not being one: publish the port, add a second
    # host, run one container with `network_mode: host`, and the whole cache —
    # session index, identity/RBAC projections, rate-limit counters — is open to
    # anything that can reach the box. Rate-limit counters matter more than they
    # sound: writable counters mean the login limiter can be reset at will,
    # which quietly undoes SEC-C3.
    #
    # `${REDIS_PASSWORD}` with NO default on purpose. An empty value makes
    # `--requirepass ""` a no-op, which would look configured and authenticate
    # nothing — the exact "control that is counted but does not bite" shape this
    # remediation keeps finding. It must be set in `.env`, and REDIS_URL must
    # carry the same secret (redis://:<password>@redis:6379).
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}",
      ]
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    ports:
      # loopback only — never expose Redis to the public interface
      - "127.0.0.1:6379:6379"
    volumes:
      - praxis_redisdata:/data
    healthcheck:
      # Must authenticate too, or the healthcheck reports a container "healthy"
      # that no client can actually use — and with `--requirepass` set, an
      # unauthenticated PING answers NOAUTH rather than PONG.
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── PgBouncer — transaction pooling for the tenant fleet (WS-S1 / D3) ─────
  #
  # Opt-in. Nothing routes through it until TENANT_DB_POOLER_HOST is set, so
  # bringing the container up is safe on its own and switching over is one env
  # change (plus a restart) that can be reverted just as fast.
  #
  # BEFORE FIRST USE: run `npm run db:pgbouncer-auth` once. It creates the
  # lookup role and the SECURITY DEFINER function auth_query depends on. Without
  # it every pooled connection fails authentication, which reads like a Postgres
  # outage and is not one.
  #
  # Migrations, provisioning and pg_dump deliberately keep talking to Postgres
  # directly — they need session state that transaction pooling does not keep.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: praxis_pgbouncer
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGBOUNCER_UPSTREAM_HOST: postgres
      PGBOUNCER_UPSTREAM_PORT: "5432"
      PGBOUNCER_AUTH_USER: ${PGBOUNCER_AUTH_USER:-pgbouncer}
      # An empty password must not silently render a userlist entry that
      # authenticates nothing while looking configured — but the check belongs in
      # the ENTRYPOINT, not here.
      #
      # This was `${...:?...}` until 2026-08-12, when it blocked four consecutive
      # deploys. Compose's `:?` aborts interpolation of the WHOLE FILE, not just
      # this service, so a production host without the variable could not run any
      # `docker compose` command at all — including the `exec postgres` that
      # deploy.sh uses for its pre-migration backup, which then failed reporting a
      # missing DB_USER. A required variable for an inert, opt-in service took
      # down every deploy on the box and pointed at the wrong cause.
      #
      # docker/pgbouncer/docker-entrypoint.sh already refuses to start without
      # this, with a better message. One container failing to start is the
      # correct blast radius; the whole compose file failing to parse is not.
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:-}
      PGBOUNCER_AUTH_DBNAME: ${DB_NAME:-praxislsdata}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      # default_pool_size × active tenants must stay under Postgres
      # max_connections with headroom — one database per tenant multiplies this.
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-5}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-2}
      PGBOUNCER_MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-80}
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini.template:/etc/pgbouncer/pgbouncer.ini.template:ro
      - ./docker/pgbouncer/docker-entrypoint.sh:/usr/local/bin/praxis-pgbouncer-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/praxis-pgbouncer-entrypoint.sh"]
    ports:
      # loopback only, same rule as Postgres — the pooler is not a public service
      - "127.0.0.1:6432:6432"
    healthcheck:
      # `pg_isready` through the pooler proves it is listening AND can reach
      # Postgres; checking the port alone would pass while the upstream is down.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 6432 -U ${PGBOUNCER_AUTH_USER:-pgbouncer} || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── External uptime prober (WS-U1) ────────────────────────────────────────
  #
  # Its own container precisely so it does NOT share a fate with the API. A
  # prober inside the API process cannot record the API being down — it isn't
  # running to notice — which is the single failure the workstream exists for.
  #
  # Better still: run this on another host or region entirely. Same command, a
  # DATABASE_URL pointing back here. In-compose is the honest minimum: it
  # survives an API crash, though not a whole-host loss.
  #
  # Set UPTIME_PROBE_IN_PROCESS=false when this runs, or both probe and every
  # host is sampled twice per interval, inflating availability. scripts/deploy.sh
  # now checks that pairing and refuses to start this container while the API is
  # still sampling in-process, so the two cannot both be on by accident.
  #
  # ROLLED BY deploy.sh. It previously was not: `restart: unless-stopped` kept
  # whatever container already existed alive across every deploy, so on hosts
  # where it was running it went on running its original image indefinitely,
  # while on hosts where it had never been started nothing ever started it.
  # `UPTIME_PROBE_IN_COMPOSE=false` opts out (for deployments running the prober
  # on another host, which is the better arrangement).
  uptime-probe:
    build:
      context: .
      target: worker
    container_name: praxis_uptime_probe
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      # No REDIS_URL and no tenant registry: this process talks to the platform
      # database and to public hostnames over HTTP, and to nothing else.
    command: ["node", "scripts/ops/uptime-probe.js"]

  # One-shot deployment gate: prove the image can launch Alpine's system
  # Chromium through Puppeteer and render a valid PDF before any migration or
  # application process is allowed to start.
  puppeteer-preflight:
    build:
      context: .
      target: runtime
    # env_file, AND no explicit PUPPETEER_EXECUTABLE_PATH — both deliberate.
    #
    # This service used to set the path itself and load no .env, which made it
    # the ONE container that never saw what api/worker see. Compose passes a
    # `KEY=` line from .env into a container as an empty string, overriding the
    # image's own ENV; api and worker got that empty value, the signature card
    # renderer took it literally, and Chromium was never found. This gate went
    # green on that exact image on every deploy, because it had hard-coded the
    # right answer for itself.
    #
    # A gate that runs in a different environment from the thing it gates only
    # proves the gate works. It now boots the way the app boots.
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["node", "scripts/ops/puppeteer-preflight.js"]
    restart: "no"

  # One-shot: runs platform + all-tenant migrations, then exits. api/worker wait
  # for it, so a plain `docker compose up -d` is always schema-current — on the
  # first boot AND on every update. Migrations are tracked per file (re-running
  # is a no-op) and `db:migrate:tenants` with zero tenants is a no-op too.
  migrate:
    build:
      context: .
      target: runtime
    depends_on:
      puppeteer-preflight: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      # the migrator/provisioner connects via TENANT_DB_HOST_DEFAULT (falls back
      # to localhost, NOT DB_HOST) — it must also point at the postgres service
      TENANT_DB_HOST_DEFAULT: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    command: sh -c "npm run db:migrate:platform && npm run db:migrate:tenants"
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    container_name: praxis-ls
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    depends_on:
      puppeteer-preflight: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    # These override the LOCAL values in .env so the same .env works for both
    # `npm run dev` (localhost) and `docker compose up` (service DNS names).
    # The code reads REDIS_URL (not REDIS_HOST — that var is dead/ignored).
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      TENANT_DB_HOST_DEFAULT: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: "8080"
      ENABLE_WORKERS: "false"
    ports:
      - "3000:8080" # host:container — app listens on 8080 inside the container
    volumes:
      - ./media:/app/media
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      # STORAGE_LOCAL_PATH=./data/vault — the document vault MUST persist across
      # container rebuilds or every uploaded/rendered document is lost.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Hot-standby copy of the api on host port 3001. nginx lists it as `backup`,
  # so it receives traffic ONLY while the primary is down — which is exactly the
  # window during a rolling deploy (scripts/deploy.sh restarts standby first,
  # then the primary). Keeping it backup-only also keeps all socket.io clients
  # on one instance (no cross-instance emit fan-out exists).
  api-standby:
    build:
      context: .
      target: runtime
    container_name: praxis-ls-standby
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    depends_on:
      puppeteer-preflight: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      TENANT_DB_HOST_DEFAULT: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: "8080"
      ENABLE_WORKERS: "false"
    ports:
      - "127.0.0.1:3001:8080"
    volumes:
      - ./media:/app/media
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build:
      context: .
      target: worker
    container_name: praxis_worker
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    depends_on:
      puppeteer-preflight: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      TENANT_DB_HOST_DEFAULT: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - ./media:/app/media
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data

volumes:
  praxis_pgdata:
  praxis_redisdata:
