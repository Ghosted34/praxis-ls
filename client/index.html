<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- PLACEHOLDER ONLY — overwritten at runtime from the tenant's App & PWA
         settings (lib/pwa-config.ts, applyPwaDocument). This tag, not the
         manifest, is what paints an installed app's title bar / status bar, so
         a hardcoded value here silently overrode every tenant's own colour. It
         stays for the pre-boot frame; keep it neutral. -->
    <meta name="theme-color" content="#f4f7fb" />
    <!-- Per-tenant PWA: manifest + iOS home-screen icon are served dynamically
         by the API from the tenant's branding (Host-resolved). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Praxis LS" />
    <!-- Fonts are SELF-HOSTED (@fontsource-variable/inter, imported by
         src/main.tsx). The previous Google-Fonts <link> pulled 11 weights of
         Playfair Display + Montserrat from a third-party origin, blocking first
         render — and because workbox only precaches local assets, the offline
         mode this PWA advertises fell back to Georgia + system sans, so the app
         looked like a different product offline (audit F17). A bundled variable
         font is emitted into dist/assets and picked up by the existing
         `**/*.woff2` precache glob. -->
    <title>Praxis LS</title>
  </head>
  <body>
    <!--
      PRE-BOOT TITLE BAR.

      The real strip is drawn by React (app/layout/app-shell.tsx), which means
      that between the window opening and the bundle booting there is nothing in
      the overlay region at all. On a cold start that is a visible gap where the
      title bar should be, and it is the first thing anyone sees of the app.

      This paints the bar's surface immediately, before a single byte of
      JavaScript runs, so the window is structurally correct from the first
      frame and the real strip replaces it in place rather than appearing from
      nothing. Same reason the shell has no layout shift: the height and the
      insets are identical to `.wco`, so nothing moves when React takes over.

      Inline styles, not a class: index.css is a separate request, and a
      stylesheet that has not arrived yet cannot paint the frame this exists to
      cover. The colour is the same custom property applyPwaDocument writes, with
      the light-theme surface as the literal fallback for the very first paint
      of a session, before the tenant's own value is known.

      aria-hidden and removed the moment the shell mounts — it is scaffolding,
      never a second copy of the bar for a screen reader to find.
    -->
    <div
      id="pre-boot-titlebar"
      aria-hidden="true"
      style="
        min-height: 44px;
        padding-left: env(titlebar-area-x, 0px);
        padding-right: calc(100% - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100%));
        background: var(--titlebar-bg, #ffffff);
        border-bottom: 1px solid rgb(16 30 52 / 0.09);
        -webkit-app-region: drag;
        app-region: drag;
      "
    ></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
