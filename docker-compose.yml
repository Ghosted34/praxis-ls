services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: praxis_postgres
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-praxislsdata}
      POSTGRES_USER: ${DB_USER:-praxis-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # loopback only — never expose Postgres to the public interface
      - "127.0.0.1:5432:5432"
    volumes:
      - praxis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: praxis_redis
    # SEC-L2 — require a password.
    #
    # Redis was unauthenticated, mitigated only by the loopback port binding
    # below. That is a real mitigation and it is also a single line of
    # docker-compose away from not being one: publish the port, add a second
    # host, run one container with `network_mode: host`, and the whole cache —
    # session index, identity/RBAC projections, rate-limit counters — is open to
    # anything that can reach the box. Rate-limit counters matter more than they
    # sound: writable counters mean the login limiter can be reset at will,
    # which quietly undoes SEC-C3.
    #
    # `${REDIS_PASSWORD}` with NO default on purpose. An empty value makes
    # `--requirepass ""` a no-op, which would look configured and authenticate
    # nothing — the exact "control that is counted but does not bite" shape this
    # remediation keeps finding. It must be set in `.env`, and REDIS_URL must
    # carry the same secret (redis://:<password>@redis:6379).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    ports:
      # loopback only — never expose Redis to the public interface
      - "127.0.0.1:6379:6379"
    volumes:
      - praxis_redisdata:/data
    healthcheck:
      # Must authenticate too, or the healthcheck reports a container "healthy"
      # that no client can actually use — and with `--requirepass` set, an
      # unauthenticated PING answers NOAUTH rather than PONG.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot: runs platform + all-tenant migrations, then exits. api/worker wait
  # for it, so a plain `docker compose up -d` is always schema-current — on the
  # first boot AND on every update. Migrations are tracked per file (re-running
  # is a no-op) and `db:migrate:tenants` with zero tenants is a no-op too.
  migrate:
    build:
      context: .
      target: runtime
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      # the migrator/provisioner connects via TENANT_DB_HOST_DEFAULT (falls back
      # to localhost, NOT DB_HOST) — it must also point at the postgres service
      TENANT_DB_HOST_DEFAULT: postgres
      REDIS_URL: redis://redis:6379
    command: sh -c "npm run db:migrate:platform && npm run db:migrate:tenants"
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    container_name: praxis-ls
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    # These override the LOCAL values in .env so the same .env works for both
    # `npm run dev` (localhost) and `docker compose up` (service DNS names).
    # The code reads REDIS_URL (not REDIS_HOST — that var is dead/ignored).
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      TENANT_DB_HOST_DEFAULT: postgres
      REDIS_URL: redis://redis:6379
      PORT: "8080"
      ENABLE_WORKERS: "false"
    ports:
      - "3000:8080"   # host:container — app listens on 8080 inside the container
    volumes:
      - ./media:/app/media
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      # STORAGE_LOCAL_PATH=./data/vault — the document vault MUST persist across
      # container rebuilds or every uploaded/rendered document is lost.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Hot-standby copy of the api on host port 3001. nginx lists it as `backup`,
  # so it receives traffic ONLY while the primary is down — which is exactly the
  # window during a rolling deploy (scripts/deploy.sh restarts standby first,
  # then the primary). Keeping it backup-only also keeps all socket.io clients
  # on one instance (no cross-instance emit fan-out exists).
  api-standby:
    build:
      context: .
      target: runtime
    container_name: praxis-ls-standby
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      TENANT_DB_HOST_DEFAULT: postgres
      REDIS_URL: redis://redis:6379
      PORT: "8080"
      ENABLE_WORKERS: "false"
    ports:
      - "127.0.0.1:3001:8080"
    volumes:
      - ./media:/app/media
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build:
      context: .
      target: worker
    container_name: praxis_worker
    # OBS-L7: no logging block anywhere meant Docker's json-file driver grew
    # without bound on a single-VPS deployment whose disk is itself unmonitored
    # — a plausible CAUSE of the 02:00 outage, taking postgres, redis, api,
    # standby and worker down together. Capped here. Shipping logs off-box is
    # the other half and stays tracked as OBS-L7.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # OBS-A4 (2026-08-04): no service declared a restart policy, so a crashed
    # container stayed down until a human noticed — and nothing notified anyone
    # (OBS-A1). This also pairs with the uncaughtException change in server.js:
    # the API now EXITS on an uncaught throw rather than continuing in an
    # undefined state, which is only an improvement if something restarts it.
    #
    # `unless-stopped`, not `always`: it will not resurrect a container you
    # deliberately stopped during an incident.
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      TENANT_DB_HOST_DEFAULT: postgres
      REDIS_URL: redis://redis:6379
    volumes:
      - ./media:/app/media
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data:/app/data

volumes:
  praxis_pgdata:
  praxis_redisdata:
