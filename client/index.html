<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- PLACEHOLDER ONLY — overwritten at runtime from the tenant's App & PWA
         settings (lib/pwa-config.ts, applyPwaDocument). This tag, not the
         manifest, is what paints an installed app's title bar / status bar, so
         a hardcoded value here silently overrode every tenant's own colour. It
         stays for the pre-boot frame; keep it neutral. -->
    <meta name="theme-color" content="#f4f7fb" />
    <!-- Per-tenant PWA: manifest + iOS home-screen icon are served dynamically
         by the API from the tenant's branding (Host-resolved). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Praxis LS" />
    <!-- Fonts are SELF-HOSTED (@fontsource-variable/inter, imported by
         src/main.tsx). The previous Google-Fonts <link> pulled 11 weights of
         Playfair Display + Montserrat from a third-party origin, blocking first
         render — and because workbox only precaches local assets, the offline
         mode this PWA advertises fell back to Georgia + system sans, so the app
         looked like a different product offline (audit F17). A bundled variable
         font is emitted into dist/assets and picked up by the existing
         `**/*.woff2` precache glob. -->
    <title>Praxis LS</title>
    <!--
      PRE-PAINT THEME + TITLE-BAR RESTORE.

      This has to be INLINE and it has to be here — src/main.tsx is a `type=
      "module"` script and modules are DEFERRED, so the browser paints the body
      once with the raw fallbacks (light `--card`, white `#ffffff` in the
      pre-boot bar, the static light `<meta name="theme-color">`) BEFORE main.tsx
      gets a chance to set `.dark` on <html> or restore the cached
      `--titlebar-bg`. On a dark-themed workspace that first painted frame is a
      white flash across the title bar and the browser's own chrome, followed a
      moment later by the correct dark bar — which is what the WCO-flash bug
      report described. Running the same code inline and blocking here makes the
      restore happen BEFORE first paint, so the first frame is already correct.

      Idempotent with lib/theme-mode.ts and lib/pwa-config.ts: `.dark` is what
      those modules toggle, `--titlebar-bg` is what `applyPwaDocument` writes,
      and `praxis.titlebar.{dark,light}` is the key it already stores. When
      nothing is cached (first ever launch, private mode, storage error) we
      fall through and the inline pre-boot fallbacks stand — the honest
      outcome, no guess. See lib/theme-mode.ts and lib/pwa-config.ts.
    -->
    <script>
      (function () {
        // These MIRROR SURFACE_LIGHT/SURFACE_DARK in packages/shared/pwa-design.js
        // — the defaults `resolveTitlebar` returns when a tenant has not set an
        // explicit titlebar colour. Duplicated here rather than imported for
        // the same reason the shared module duplicates them from index.css:
        // this script runs before any stylesheet or module has been fetched.
        var SURFACE_LIGHT = "#ffffff";
        var SURFACE_DARK = "#12161e";
        try {
          var stored = localStorage.getItem("praxis.theme");
          var mode =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var isDark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          // Set the dark class BEFORE first paint — Tailwind is darkMode:"class",
          // so this flips every token and the whole app paints dark from frame
          // 1 instead of flashing the light theme for the moment before
          // main.tsx runs.
          if (isDark) document.documentElement.classList.add("dark");
          // color-scheme lets the browser paint its own chrome (scrollbars,
          // form controls) in the right mode from frame 1 as well.
          document.documentElement.style.colorScheme = isDark
            ? "dark"
            : "light";
          // The cached titlebar colour from the LAST session under this theme
          // (written by applyPwaDocument). If none, fall back to the
          // theme-matched default so the strip never paints white on a dark
          // workspace — the whole point of this script.
          var barBg =
            localStorage.getItem(
              "praxis.titlebar." + (isDark ? "dark" : "light"),
            ) || (isDark ? SURFACE_DARK : SURFACE_LIGHT);
          document.documentElement.style.setProperty("--titlebar-bg", barBg);
          // Update <meta name="theme-color"> in step — Chrome tints its own
          // chrome (tab strip, address bar) from this on first paint, and the
          // static tag above is a light fallback that would otherwise flash
          // for a moment on refresh in a dark workspace.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", barBg);
          // THE WINDOW FRAME — the rounded top corners and the band behind the
          // caption buttons — is painted from the MANIFEST's `theme_color`, not
          // from the tag above, and it is read before any of this runs. The
          // server has no way to know which theme this user is in (light/dark
          // is per-user, in localStorage; the manifest only sees the tenant-wide
          // `brand_theme`), so a dark-mode user in a light-default workspace got
          // a white frame around a dark app on every refresh. Tell it.
          var manifest = document.querySelector('link[rel="manifest"]');
          if (manifest)
            manifest.setAttribute(
              "href",
              "/manifest.webmanifest?theme=" + (isDark ? "dark" : "light"),
            );
        } catch (e) {
          /* private mode / storage disabled — the static fallbacks stand */
        }
      })();
    </script>
  </head>
  <body>
    <!--
      PRE-BOOT TITLE BAR.

      The real strip is drawn by React (app/layout/app-shell.tsx), which means
      that between the window opening and the bundle booting there is nothing in
      the overlay region at all. On a cold start that is a visible gap where the
      title bar should be, and it is the first thing anyone sees of the app.

      This paints the bar's surface immediately, before a single byte of
      JavaScript runs, so the window is structurally correct from the first
      frame and the real strip replaces it in place rather than appearing from
      nothing. Same reason the shell has no layout shift: the height and the
      insets are identical to `.wco`, so nothing moves when React takes over.

      Inline styles, not a class: index.css is a separate request, and a
      stylesheet that has not arrived yet cannot paint the frame this exists to
      cover. The colour is the same custom property applyPwaDocument writes, with
      the light-theme surface as the literal fallback for the very first paint
      of a session, before the tenant's own value is known.

      aria-hidden and removed the moment the shell mounts — it is scaffolding,
      never a second copy of the bar for a screen reader to find.
    -->
    <!--
      `--titlebar-bg` is now ALWAYS set by the inline script above — either to
      the cached value from a prior session or to a theme-matched default —
      so this div paints the right colour on the very first frame, no light
      flash on a dark workspace. The border is a neutral low-alpha grey
      because it has to survive both themes with no JS involved.
    -->
    <div
      id="pre-boot-titlebar"
      aria-hidden="true"
      style="
        min-height: 44px;
        padding-left: env(titlebar-area-x, 0px);
        padding-right: calc(
          100% - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100%)
        );
        background: var(--titlebar-bg);
        border-bottom: 1px solid rgb(128 128 128 / 0.14);
        -webkit-app-region: drag;
        app-region: drag;
      "
    ></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
