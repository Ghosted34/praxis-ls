# Deploy — SSH rolling deploy to the production VPS.
#
# Triggers after the CI workflow SUCCEEDS on main (never deploys a red build),
# or manually via workflow_dispatch. The server does the actual work in
# scripts/deploy.sh: build → migrate → roll standby → roll primary → worker.
# nginx's backup upstream (praxis-ls-standby on :3001) absorbs traffic while
# the primary restarts, so the reload is effectively zero-downtime.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      server IP or hostname        e.g. 51.254.165.120
#   DEPLOY_USER      ssh user                     e.g. root
#   DEPLOY_SSH_KEY   PRIVATE key (openssh format) whose public half is in
#                    ~/.ssh/authorized_keys on the server
#
# The server also needs to be able to `git fetch` this repo. It is NOT expected
# to hold a credential of its own: this workflow forwards the run's own
# read-only token (see DEPLOY_GIT_TOKEN below), so nothing on the box can expire
# and take a deploy down with it. Optional secret DEPLOY_GIT_TOKEN overrides it
# with a long-lived PAT if the server ever needs to fetch something the run's
# token cannot reach.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    # TC-D7 — a manual deploy can now name a commit.
    #
    # The dispatch path took no input, so it always shipped whatever `main` was
    # at execution time. That is precisely backwards during an incident: the
    # moment you most need to deploy a specific known-good commit is the moment
    # `main` is the thing that broke.
    #
    # Blank keeps the existing behaviour (current `main`), so the automatic path
    # is unchanged.
    inputs:
      ref:
        description: "Commit SHA or branch to deploy (blank = current main)"
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Read-only, and the only thing it is used for: the server fetching this
    # repo over HTTPS with the token forwarded in the deploy step.
    permissions:
      contents: read
    # TC-D5, the half that lives in this repo.
    #
    # The finding: this job holds a shell on the production host, authenticated
    # by one long-lived private key, with no GitHub Environment, no required
    # approval and no rotation policy. `workflow_dispatch` is open to anyone
    # with write access. The workflow's own docs give the example
    # `DEPLOY_USER  e.g. root` — if that is literal, every CI run has
    # unrestricted shell on production, and a compromised Action or a malicious
    # dependency in any workflow step is a host compromise rather than a bad
    # deploy.
    #
    # Naming an Environment is the part that is code. It gives the secrets a
    # scope, gives you an approval gate and a deployment history, and lets the
    # key be rotated in one place. **Create it in Settings → Environments →
    # `production`** and move DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY into
    # it; until it exists, GitHub falls back to repository secrets and this line
    # is inert, so it is safe to land ahead of the settings change.
    #
    # THE REST IS NOT CODE and is not closed by this line — see
    # doc/DEPLOYMENT.md: create an unprivileged `deploy` user, give it docker
    # group membership plus only the sudo entries deploy.sh needs, restrict the
    # authorized_keys entry (`from=`, `command=`), and set a rotation date.
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # TC-CI1, the half that lives in code.
      #
      # Branch protection itself is a GitHub settings change (doc/BRANCH_PROTECTION.md).
      # Until it is switched on — and as a second line after it is — this refuses
      # to deploy a commit that reached `main` without a pull request.
      #
      # The audit's finding was that 45% of changes were pushed straight to main
      # and every green push auto-deployed. The six consecutive deploy failures
      # on 2026-08-04 all went to production with no review. They happened to be
      # crashes, which is the lucky version: a crash fails loudly and touches
      # nothing. The same path was open to a migration that corrupts data.
      #
      # A direct push is stopped here rather than allowed and reported, because
      # a warning on a deploy that already happened is not a control. Use
      # workflow_dispatch for a deliberate manual deploy — that is a person
      # choosing, which is the thing being asked for.
      # TEMPORARILY DISABLED 2026-08-05 (by request). The PR-review gate below is
      # turned off: `if: false` means it never runs, so auto-deploy no longer
      # requires a commit to have arrived via pull request.
      # RE-ENABLE by restoring the condition to:
      #   if: ${{ github.event_name == 'workflow_run' }}
      - name: Refuse to deploy an unreviewed commit
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                  -H "Accept: application/vnd.github.groot-preview+json" \
                  --jq 'length')
          if [ "$prs" -eq 0 ]; then
            echo "::error::$SHA reached main without a pull request. Refusing to deploy."
            echo ""
            echo "This is TC-CI1. Open a PR, get it reviewed, and merge it — or, if this"
            echo "is a deliberate emergency deploy, trigger this workflow manually"
            echo "(Actions -> Deploy -> Run workflow), which records who chose to."
            echo ""
            echo "Turn on branch protection so this cannot happen: doc/BRANCH_PROTECTION.md"
            exit 1
          fi
          echo "$SHA arrived via pull request. Proceeding."

      - name: Rolling deploy over SSH
        # NATIVE ssh — no runtime binary download. appleboy/ssh-action fetches a
        # `drone-ssh` binary from the GitHub releases CDN on every run; on
        # 2026-08-12 that download returned 503 repeatedly and the deploy failed
        # before it ever reached the host. This uses the ssh client preinstalled
        # on the runner, so a GitHub CDN blip can no longer fail the deploy.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # TC-D7 / TC-R3. DEPLOY_REF pins the commit; blank means current main.
          # Automatic path = the exact commit whose CI turned green, so the thing
          # that was tested is the thing that ships, by name.
          DEPLOY_REF: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || '' }}
          # The credential the server's `git fetch` uses (2026-09-02: the deploy
          # died at that fetch because the box had none — see scripts/deploy.sh
          # "Fetch auth" and doc/DEPLOYMENT.md §6a). The run's own token is
          # read-only and expires with the run, which is why it is preferred
          # over anything stored on the host.
          DEPLOY_GIT_TOKEN: ${{ secrets.DEPLOY_GIT_TOKEN || github.token }}
          DEPLOY_GIT_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The remote side is PIPED IN, not passed as a command string.
          #
          # Two reasons. A command string is argv to a shell on the server, so
          # anything in it — the token — is readable with `ps` by anyone on the
          # box for the length of the deploy. And the credential has to be in
          # place BEFORE scripts/deploy.sh runs: the copy that runs is the one
          # already checked out on the server, i.e. the version WITHOUT the fix,
          # whose plain `git fetch` is what died on 2026-09-02. A GIT_ASKPASS
          # exported here is inherited by every git in the session, so the fix
          # does not need to already be on the server to get onto the server.
          # scripts/deploy.sh keeps its own credential handling for hand-runs.
          #
          # %q quotes each value for the remote bash, so a DEPLOY_REF typed into
          # the workflow_dispatch box cannot break out into a command.
          {
            printf 'export DEPLOY_GIT_TOKEN=%q\n' "$DEPLOY_GIT_TOKEN"
            printf 'export DEPLOY_REF=%q\n' "$DEPLOY_REF"
            printf 'export DEPLOY_GIT_REMOTE=%q\n' "$DEPLOY_GIT_REMOTE"
            cat <<'REMOTE'
          set -euo pipefail

          ASKPASS="$(mktemp)"
          trap 'rm -f "$ASKPASS"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in Username*) printf "x-access-token\n" ;; *) printf "%s\n" "$DEPLOY_GIT_TOKEN" ;; esac' \
            > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0

          cd ~/praxis-ls
          # </dev/null: this script is itself arriving on stdin, and a child that
          # read stdin would eat the rest of it. deploy.sh wants none of it anyway.
          bash scripts/deploy.sh </dev/null
          REMOTE
          # 30-minute cap (matches the old command_timeout). accept-new pins the
          # host key on first contact — the same trust level the action used by
          # default (its `fingerprint` input was blank).
          } | timeout 30m ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -l -s"
