name: CI

# Backend CI for praxis-ls. Runs on every push to main and every PR (the repo
# uses a PR-based workflow per the kickoff). Deliberately does NOT deploy —
# deployment target/secrets aren't decided yet (see doc/WORK_TO_BE_DONE.md
# Phase 5). This gate is: does it parse, lint, test, and does the image build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# TC-D8 — CI had no concurrency group while `deploy.yaml` correctly has one.
#
# Two rapid pushes to `main` produced two CI runs, two `workflow_run` completion
# events and two queued deploys ordered by COMPLETION time rather than commit
# order. Because `deploy.sh` pulls whatever `main` is at execution time, the
# practical result was a redundant deploy rather than a reversed one — but the
# trigger SHA and the deployed SHA were then provably different, which is the
# traceability failure in TC-R3. On 2026-08-03 there were eight pushes to `main`
# between 09:33 and 16:16, several within fifteen minutes.
#
# `cancel-in-progress` differs by branch, deliberately:
#   PRs  — cancel. A superseded PR run tells you about code that no longer
#          exists, and the ref keys the group so PRs never cancel each other.
#   main — DO NOT cancel. A main run is the deploy trigger; cancelling it drops
#          the deploy for that commit and CI history gains a hole exactly where
#          "was this commit ever green?" needs answering.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # TC-CI8. This was `npm install`, with a comment explaining that the
        # lockfile is Windows-generated so `ci` on a Linux runner could omit the
        # linux platform binaries (sharp, argon2).
        #
        # THAT PREMISE IS FALSE, and it was worth checking rather than
        # inheriting. lockfileVersion 3 records every platform variant
        # regardless of the machine that generated it — verified: this lockfile
        # contains @img/sharp-linux-x64, @img/sharp-libvips-linux-x64, argon2
        # and node-gyp-build. npm resolves the right ones by os/cpu at install.
        #
        # The cost of the old line is the finding itself: `npm install` may
        # resolve a NEWER version than the lockfile pins, so CI tested a
        # dependency tree that is neither the one the Dockerfile builds nor the
        # one that gets deployed. A green CI proved nothing about the artifact.
        run: npm ci --no-audit --no-fund

      - name: Syntax check every source file
        # node --check catches parse/syntax errors the linter's config might skip
        # and needs no DB/Redis — the cheapest possible "it at least parses" gate.
        run: |
          find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Shell scripts parse and are LF
        # Added 2026-08-04 after a CRLF rollback.sh failed to parse on the
        # server — `syntax error near unexpected token $'do\r'`. Nothing caught
        # it, because nothing had ever executed that script: deploy and rollback
        # are exactly the code you only run when things are already going wrong.
        #
        # .gitattributes now enforces LF on commit; this asserts the RESULT,
        # because a policy nobody verifies is the failure mode this whole
        # workstream is about. `bash -n` additionally catches syntax errors in
        # scripts no test ever executes.
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::CRLF line endings — this script will not run on Linux"
              fail=1
            fi
            if ! bash -n "$f" 2>&1; then
              echo "::error file=$f::bash syntax error"
              fail=1
            fi
          done < <(git ls-files '*.sh')
          if [ "$fail" -eq 0 ]; then echo "All shell scripts parse and are LF."; fi
          exit "$fail"

      - name: Lint
        # TC-CI10 (first half) — lint now BLOCKS.
        #
        # `eslint .` was verified to exit 0 with warnings present, because
        # `no-unused-vars` and `no-shadow` are configured as "warn". So between
        # `node --check` (does it parse) and Jest (does this function work) there
        # was no semantic gate at all: a typo in a property name on an untested
        # path reached production.
        #
        # A RATCHET, not zero. There are 136 warnings today — measured, not
        # estimated. Setting `--max-warnings 0` would fail the build on arrival
        # and be reverted by whoever it blocked first, which is how a gate
        # becomes a comment (same reasoning as the coverage floor). The ceiling
        # stops warnings GROWING; lower it as they are cleared, and the edit to
        # this number is the record that they were.
        #
        # The other half of CI10 — a backend type-check — is NOT done. The
        # backend is plain CommonJS with no type layer, and adding one is a
        # project, not a pipeline step. Worth knowing that
        # SmartLS_PRD_Master_Functional_Spec_v2.md:216 promises "every merge runs
        # lint + type-check + unit/integration tests"; the PRD and the pipeline
        # still disagree on type-check, and the PRD is the thing that should move.
        run: npm run lint

      - name: PR title is usable as a changelog line
        # TC-R4. Most commits use conventional prefixes, so the raw material is
        # there — but the MERGE commits, which are the integration points a
        # changelog is built from, carry the least information: "Lots of
        # changes", "a lot", "audit portan and opportunities board list".
        #
        # A squash-merge takes its message from the PR TITLE, so gating the title
        # is what actually fixes the history. PRs only — a push to main has no
        # title to check, and CI1's branch protection is what stops those.
        #
        # Deliberately permissive on scope and wording; it only requires a type
        # prefix, which is the difference between a generated changelog and a
        # manual archaeology session.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -u
          if printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|perf|test|build|ci|revert)(\([a-z0-9 ._/-]+\))?!?: .{6,}'; then
            echo "PR title OK: $PR_TITLE"
            exit 0
          fi
          echo "::error::PR title is not usable as a changelog entry: \"$PR_TITLE\""
          echo "::error::Use  type(scope): what changed  — e.g. \"fix(ledger): reject unbalanced entries at the database\""
          echo "::error::Types: feat fix chore docs refactor perf test build ci revert"
          exit 1

      - name: Env template matches the schema
        # TC-E1. Nothing anywhere compared `.env.example` to what `env.js`
        # actually requires, so the template drifted silently. The cost of that
        # drift is paid in the worst possible place: a change that adds a
        # required variable passes CI, passes the image build, RUNS ITS
        # MIGRATIONS against every tenant database, and only then fails to boot.
        # This moves the discovery to the PR.
        run: node scripts/check-env-template.js

      - name: Font gate
        # No font from outside client/src/lib/fonts.ts may be NAMED anywhere —
        # UI, PDF templates, Excel exports, email shells, the platform console.
        # This is grep-shaped rather than a lint rule because the failure mode is
        # not a syntax error: a font name that resolves to nothing substitutes
        # silently. Nine surfaces were doing exactly that when the gate was
        # written — invoices going to clients came out in FreeSans while the
        # template said Noto Sans, and the Excel title block asked for a face
        # (Playfair Display) this product has never shipped.
        #
        # It spans both apps and the backend, so it runs here rather than in the
        # per-app matrix below.
        run: npm run check:fonts

      - name: Test
        # TC-CI3 — coverage is MEASURED here, and the summary is printed.
        #
        # The Test step was `npx jest --runInBand`: no coverage, no threshold, no
        # report, no artifact. The numbers in the audit had to be produced by
        # hand on someone's laptop, so nobody could see whether a change moved
        # coverage up or down — which makes a remediation programme unmeasurable
        # from its first day. The threshold itself lives in jest.config.js and is
        # deliberately expressed in FUNCTIONS and BRANCHES (TC-Q1: a line or
        # statement gate is satisfied by importing files).
        #
        # TC-F2 — `--runInBand` is gone. Measured at 22.5s serial vs 7.4s
        # parallel with identical results. The audit was explicit that the right
        # moment to drop it is NOW, while the suite is pure and any breakage from
        # parallel workers is obviously new, rather than later when
        # database-touching tests make the cause ambiguous. The integration job
        # keeps `--runInBand`, because there it IS load-bearing: those suites
        # share one Postgres.
        run: npx jest --coverage --coverageReporters=text-summary --coverageReporters=lcov

      - name: Upload coverage report
        # Keeps the lcov where a human (or a future badge/diff tool) can reach it.
        # `always()` because a coverage-threshold failure is exactly when you want
        # to look at the report.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/
          retention-days: 14

      - name: Migration numbering
        # Two streams work this repo in parallel and have already collided on
        # 0470 and 0475. Those two are grandfathered (renaming an APPLIED
        # migration is unsafe — the migrator keys on filename and would re-run
        # it); this fails the build on any NEW collision, while it's still cheap
        # to renumber. See scripts/db/check-migration-numbers.js.
        run: node scripts/db/check-migration-numbers.js

      - name: Actor FK guard
        # Audit DATA 2.4: ~60 tenant columns are REFERENCES app_user(user_id),
        # identity is pinned to the LIVE schema, and a raw actor id written
        # beside SANDBOX data raises 23503 and fails the operation. emit.js
        # guards its own writes; the finding was that the guard is applied
        # INCONSISTENTLY — a defect that comes back the next time somebody adds
        # an `_by` column. This fails the build on a raw one.
        run: node scripts/check-actor-fk-guard.js

      - name: jest.mock hoisting
        # Jest hoists jest.mock above the imports, so a factory closing over a
        # module-scope variable runs before it exists — babel rejects it unless
        # the name starts with mock. Eleven suites violated this at once and
        # nothing caught it, because they had been verified under a substitute
        # runner that does not use babel. Cheap static check; loud at write time.
        run: node scripts/check-jest-mock-hoisting.js

      - name: API docs in sync
        # API F-5 / F-25: doc/API_REFERENCE.md and doc/ERROR_CODES.md are
        # GENERATED from the code. A spec that is hand-written drifts — the
        # Postman collection this replaces covered 19% and had already drifted.
        # Fails if a route or an error code was added without regenerating.
        run: node scripts/generate-api-docs.js --check

      - name: Migration reversibility
        # Audit DATA 3.5 / TEST-D2: there is not one down-migration in this
        # repo, which is half of why a bad deploy was unrecoverable (the other
        # half — no pre-migration backup — is fixed in scripts/deploy.sh).
        #
        # This does NOT retro-fit the 92 existing migrations; an untested DROP
        # written for a migration that already ran in production looks like a
        # recovery path and is not one. It requires every NEW migration to carry
        # a commented `-- DOWN` block or an explicit `-- IRREVERSIBLE: <reason>`.
        # Stops the backlog growing while DATA 3.5 is worked.
        run: node scripts/db/check-migration-reversibility.js

      - name: Destructive migrations must be declared
        # OBS-I3. `deploy.sh` applies migrations to EVERY tenant database before
        # the app rolls, the convention "keep them additive" was enforced by
        # nothing, and there are no down-migrations for anything before 0500. A
        # DROP COLUMN that passes review therefore reaches every customer's data
        # at once with no way back but the pre-deploy backup.
        #
        # Not a ban — destructive migrations are sometimes right, and a gate that
        # forbids them gets worked around. It requires an explicit
        # `-- DESTRUCTIVE: <what is lost and why that is acceptable>` marker, so
        # the sentence exists in the diff for a reviewer and in the file for
        # whoever is restoring a backup at 02:00.
        run: node scripts/db/check-destructive-migrations.js

      - name: Schema drift
        # Audit DATA 3.3: notification_preference is CREATEd in two files with
        # different columns. Both use IF NOT EXISTS, the earlier one wins, and
        # `created_at` exists on no database despite 0472 declaring it — the
        # later file half-applied and reported success.
        #
        # Nothing read the column, so nothing broke. That is what made it
        # dangerous: the migration files quietly stopped describing the schema
        # and no tooling could tell. Compared PER DATABASE, because tenant and
        # platform legitimately share three table names.
        run: node scripts/db/check-schema-drift.js

      - name: Write routes are validated
        # Audit SEC H3: request-body keys become SQL column identifiers on the
        # ten modules that mounted `passthrough` — a pair of no-op middlewares
        # that looks like a validator, is imported from shared/http/validate,
        # and sits in the slot a validator sits in.
        #
        # query-helpers now validates and quotes every identifier, so the
        # injection half cannot come back. This guards the OTHER half: a new
        # module whose write route reads req.body with neither a zod schema nor
        # a `writable` allow-list is mass assignment waiting to happen.
        run: node scripts/check-write-route-validators.js

      - name: API contract
        # Audit API F-30: nothing would catch a contract regression. No
        # versioning to roll behind, no trustworthy spec to diff, and zero tests
        # asserting the response shape of a real endpoint — a PR renaming
        # { data } to { items } on any of 731 routes passed CI.
        #
        # This diffs the live route surface against doc/api-contract.json.
        # Removals and lost auth/rbac/validator gates fail; additions do not,
        # because a check that fails on every new route gets --update'd without
        # being read.
        run: node scripts/check-api-contract.js

  # ---------------------------------------------------------------------------
  # TC-CI6 — migrations are never executed in CI; the first run is production.
  #
  # This is the finding with the worst asymmetry in the whole Test & CI/CD
  # audit. Every other gate here answers "does the code parse / lint / pass its
  # unit tests" — questions whose worst answer is a broken feature. A migration
  # that fails answers a different question, and its worst answer is a
  # half-migrated production database at the moment the deploy script has
  # already rolled the old image away.
  #
  # The six consecutive failed deploys on 2026-08-04 were crashes, which is the
  # lucky kind. A migration is the unlucky kind: 0498's unique indexes have no
  # NOT VALID escape and either build or fail the whole run, and 0497/0499/0500
  # touch 71 constraints and 290 indexes between them.
  #
  # A real Postgres, a real platform database, a real tenant provisioned from
  # nothing, and then the whole tenant migration set applied twice — because
  # idempotency is the property the migrator's ledger claims and nothing checked
  # it.
  # ---------------------------------------------------------------------------
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not stock postgres:16. platform/0040_ai_knowledge.sql does
        # `CREATE EXTENSION vector` for the AI knowledge embeddings, and the
        # stock image does not ship it — the job failed at the FIRST platform
        # migration with `extension "vector" is not available`, so it had never
        # actually exercised anything.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: praxis-admin
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: praxis_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U praxis-admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: praxis_platform
      DB_USER: praxis-admin
      DB_PASSWORD: ci-only-not-a-secret
      TENANT_DB_HOST_DEFAULT: localhost
      TENANT_DB_PORT_DEFAULT: "5432"
      TENANT_DB_SUPERUSER: praxis-admin
      TENANT_DB_SUPERUSER_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Migrate the platform database
        run: node scripts/db/migrate-platform.js

      - name: Provision a tenant from nothing
        # Exercises create-database + live/sandbox migrate + seed + register.
        # This is the path a new customer takes, and it has never run in CI.
        run: node scripts/db/provision-tenant.js --slug=citenant --name="CI Tenant"

      - name: Apply the tenant migration set again — must be a no-op
        # The migrator's whole idempotency claim is its public.schema_migration
        # ledger. Applying twice is the cheapest possible test of it, and since
        # the DATA 3.1 fix the DDL and its ledger row commit together, so a
        # second run must report zero applied.
        run: |
          set -euo pipefail
          out=$(node scripts/db/migrate-tenants.js --slug=citenant 2>&1)
          echo "$out"
          if echo "$out" | grep -qE "\(([1-9][0-9]*) files\)"; then
            echo "::error::Re-running migrations applied files that were already recorded — the ledger is not doing its job."
            exit 1
          fi

      - name: Probe the constraints that cannot be NOT VALID
        # 0498's unique doc_number indexes either build or fail the migration.
        # On a freshly seeded tenant they must build; if this ever fails, the
        # seed data itself contains duplicates.
        run: node scripts/db/probe-doc-numbers.js --slug=citenant

      - name: The fleet is on one schema version
        # DATA 3.2 / TEST-D3. migrateAllTenants used to abort on the first
        # failing tenant, splitting the fleet at an arbitrary point with nothing
        # recording where. It now continues, reports per tenant, and throws
        # afterwards — and this asserts the resulting state is uniform.
        run: node scripts/db/fleet-status.js

      - name: Seed a corporate entity, journals and an OPEN period for the integration suites
        # TEST-C6. The four integration suites are not skipped because someone
        # disabled them — they self-skip on `!process.env.DATABASE_URL`, and
        # nothing ever set it. journal-posting.test.js says so in its own
        # header: "Run in CI by adding a postgres service + db:provision, then
        # set these vars." This job now has exactly that.
        #
        # corporate_entity and journal are NOT seeded by 9000-9060 — they are
        # tenant business data, not reference data — so the fixture is created
        # here rather than pretending a seed provides it.
        id: fixture
        run: |
          set -euo pipefail
          export PGPASSWORD=ci-only-not-a-secret
          # search_path via PGOPTIONS, not a `SET` statement in the -c string.
          #
          # `psql -tAc "SET …; INSERT … RETURNING id;"` prints the COMMAND TAG of
          # every statement alongside the rows, so the capture was not a uuid —
          # it was the three lines "SET", the uuid, and "INSERT 0 1". Those got
          # interpolated into the next query and Postgres said exactly that:
          #
          #     invalid input syntax for type uuid: "SET
          #     7487d69c-… INSERT 0 1"
          #
          # Wrapping the INSERT in a CTE and SELECTing from it makes the
          # top-level statement a SELECT, which prints rows and no tag — so -tA
          # yields the bare uuid and nothing else.
          export PGOPTIONS='--search_path=live,public'
          entity=$(psql -h localhost -U praxis-admin -d tenant_citenant \
            -v ON_ERROR_STOP=1 -tAqc "
            WITH ins AS (
              INSERT INTO corporate_entity (code, legal_name, country_code)
                   VALUES ('CITEST', 'CI Test Entity', 'CM')
              ON CONFLICT (code) DO UPDATE SET legal_name = EXCLUDED.legal_name
                RETURNING entity_id
            ) SELECT entity_id FROM ins;")

          # Fail loudly rather than carrying an empty/garbled id into the next
          # statement — that is the whole failure mode above.
          case "$entity" in
            ????????-????-????-????-????????????) ;;
            *) echo "::error::expected a uuid from corporate_entity, got: '$entity'"; exit 1 ;;
          esac

          psql -h localhost -U praxis-admin -d tenant_citenant -v ON_ERROR_STOP=1 -c "
            INSERT INTO journal (code, name, entity_id) VALUES
              ('BQ','Banque','$entity'), ('VT','Ventes','$entity'),
              ('AC','Achats','$entity'), ('OD','Operations diverses','$entity')
            ON CONFLICT (entity_id, code) DO NOTHING;"

          # An OPEN accounting_period covering TODAY.
          #
          # Both integration suites document this in their own headers —
          # journal-posting: "a corporate_entity id with an OPEN
          # accounting_period covering TEST_ENTRY_DATE"; ledger-hardening: "a
          # corporate_entity with a journal + an OPEN period". Neither got one.
          # The first run failed with `No accounting period covers <today>`, and
          # ledger-hardening's beforeAll left `period` undefined, so every test
          # in it crashed on `period.period_id` rather than asserting anything.
          #
          # A CALENDAR MONTH around CURRENT_DATE, computed in SQL rather than in
          # the shell, so it is right whatever day the job runs and cannot drift
          # from the runner's clock. The suites take the most recent OPEN period,
          # and ledger-hardening's own FROZEN fixture sits in 2099, so there is
          # no overlap to trip over.
          psql -h localhost -U praxis-admin -d tenant_citenant -v ON_ERROR_STOP=1 -c "
            INSERT INTO accounting_period (entity_id, code, starts_on, ends_on, status)
            VALUES (
              '$entity',
              to_char(CURRENT_DATE, 'YYYY-MM'),
              date_trunc('month', CURRENT_DATE)::date,
              (date_trunc('month', CURRENT_DATE) + interval '1 month - 1 day')::date,
              'OPEN')
            ON CONFLICT (entity_id, code) DO UPDATE SET status = 'OPEN';"

          # Assert it rather than trusting it. A fixture that half-worked is how
          # the suites came to 'pass' by skipping in the first place: the whole
          # point of this job is that a green tick means something ran.
          covers=$(psql -h localhost -U praxis-admin -d tenant_citenant -tAqc "
            SELECT count(*) FROM accounting_period
             WHERE entity_id = '$entity' AND status = 'OPEN'
               AND CURRENT_DATE BETWEEN starts_on AND ends_on;")
          if [ "$covers" != "1" ]; then
            echo "::error::expected exactly one OPEN accounting_period covering today, found '$covers'"
            exit 1
          fi

          echo "entity_id=$entity" >> "$GITHUB_OUTPUT"
          echo "Seeded corporate_entity $entity with journals BQ/VT/AC/OD and an OPEN period for $(date +%Y-%m)"

      - name: Integration suites against the real database
        # These 11 tests have been dark since they were written. Three of the
        # four suites need only a database and now get one; mail-imap.test.js
        # needs live IMAP/SMTP credentials and stays opt-in, which is correct —
        # a test that talks to a third-party mail server does not belong in
        # every PR run.
        #
        # The assertion count is checked as well as the exit code, because the
        # whole finding is that these suites SKIPPED and nobody noticed. Jest
        # exits 0 on a run where every suite self-skipped, so "it passed" and
        # "it ran" are different questions and only one of them was ever asked.
        env:
          # search_path IS PART OF THIS URL, and has to be.
          #
          # Every tenant table lives in the `live` schema, never in `public`.
          # These suites open their own `new Pool({ connectionString })`, so
          # without it each one resolved against `public` and every query failed
          # with 42P01 — `relation "journal" does not exist`, `"opportunity"`,
          # `"event_log"`. The tables were there the whole time; the connection
          # was looking in the wrong schema.
          #
          # journal-posting.test.js says so in its own header — "DATABASE_URL
          # postgres connection string (search_path = the tenant schema)" — and
          # the value this job supplied did not honour it. That is the finding
          # these suites exist to catch, committed by the harness around them.
          #
          # `options=-c search_path=...` is libpq's own mechanism and
          # node-postgres passes it through, so it needs no change in any test.
          DATABASE_URL: >-
            postgresql://praxis-admin:ci-only-not-a-secret@localhost:5432/tenant_citenant?options=-c%20search_path%3Dlive%2Cpublic
          TEST_ENTITY_ID: ${{ steps.fixture.outputs.entity_id }}
        run: |
          set -euo pipefail
          npx jest tests/integration --runInBand --ci --json --outputFile=/tmp/integration.json || true
          passed=$(jq '.numPassedTests' /tmp/integration.json)
          failed=$(jq '.numFailedTests' /tmp/integration.json)
          echo "integration: $passed passed, $failed failed"

          if [ "$failed" -gt 0 ]; then
            jq -r '.testResults[].assertionResults[] | select(.status=="failed") | "  ✗ " + .fullName' /tmp/integration.json
            exit 1
          fi
          if [ "$passed" -lt 1 ]; then
            echo "::error::The integration suites asserted nothing — they are still self-skipping. DATABASE_URL/TEST_ENTITY_ID are not reaching them."
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        # REPORTS, DOES NOT BLOCK (2026-08-01). High and above only.
        #
        # The tree currently has 7 findings (3 high), all transitive: `uuid`
        # reached via `exceljs` and `node-cron`. Clearing them needs an exceljs
        # major bump (3.4.0, breaking) — and exceljs is the writer we'd want for
        # the xlsx report export that is still open, so that upgrade wants doing
        # deliberately rather than to turn a pipeline green.
        #
        # continue-on-error keeps the finding visible on every run without
        # blocking unrelated work. A gate everyone learns to force past is worse
        # than one that reports honestly. Flip this back to blocking once the
        # tree is clean — that is the point of leaving it here at all.
        # TC-CI4 — the gate now BLOCKS, with a dated exception rather than a
        # permanent `continue-on-error`.
        #
        # The old reasoning was sound as far as it went: the outstanding findings
        # are transitive `uuid` via `exceljs`/`node-cron`, clearing them needs a
        # breaking `exceljs` major, and "a gate everyone learns to force past is
        # worse than one that reports honestly". The flaw is that an exception
        # with no expiry is indistinguishable from an exception nobody revisits —
        # and these have been visible and unaddressed since the audit.
        #
        # `--audit-level=high` still, so moderates report without blocking. The
        # EXPIRY below is the change: past that date this step fails on any high,
        # which forces the exceljs decision to be made rather than deferred
        # again. Move the date only together with a note saying why.
        continue-on-error: false
        run: |
          set -uo pipefail
          EXPIRY="2026-10-31"
          if npm audit --audit-level=high; then
            echo "npm audit: clean at high and above."
            exit 0
          fi
          TODAY="$(date -u +%Y-%m-%d)"
          if [ "$TODAY" \< "$EXPIRY" ]; then
            echo "::warning::npm audit reports high-severity findings. KNOWN, and accepted until $EXPIRY:"
            echo "::warning::transitive uuid via exceljs/node-cron — clearing it needs a breaking exceljs major (TC-CI4)."
            echo "::warning::After $EXPIRY this step FAILS. Schedule the upgrade."
            exit 0
          fi
          echo "::error::npm audit has high-severity findings and the accepted-risk window expired on $EXPIRY."
          echo "::error::Either do the exceljs upgrade or move the EXPIRY in ci.yaml with a written reason."
          exit 1

      - name: Secret scan
        # Catches a key pasted into a commit. The repo has real history here: the
        # kickoff shared provider keys in plaintext (Gemini/DeepSeek/Groq/
        # exchangerate) and they had to be rotated. `.env` ships placeholders like
        # __rotate_me__, which are deliberately NOT matched (see PLACEHOLDER).
        #
        # 2026-08-04 (audit SEC-C1 / TC-CI5). Two independent defects were fixed
        # here, and BOTH were needed — either alone leaves the scan useless:
        #
        #   1. ':!doc/reference' excluded the one directory that actually held
        #      live credentials. Five files: three legacy `config/db.php`, an
        #      inline `new mysqli(...)` in administration/index.php, and an
        #      Office365 SMTP user/password in a test view. Exclusion removed.
        #      Vendor trees are still skipped — they are third-party source, and
        #      phpmailer's own README carries example credentials.
        #
        #   2. The pattern set only matched provider API keys (sk-, AIza, gsk_,
        #      PEM, AKIA). NONE of it matches `$DB_PASS = '…'`. So even scanning
        #      doc/reference would have passed those five files clean. Database
        #      credentials, SMTP credentials and URL-embedded passwords are now
        #      matched too.
        #
        # Adding a pattern here is cheap. Leaving one out is how the last set got
        # committed — so if you find a credential shape this misses, add it in
        # the same commit as the fix.
        #
        # Third pass, same day. The second pass FAILED ITS FIRST CI RUN, which is
        # the point of it existing, and produced three more lessons:
        #
        #   a. It found a live Groq key in two more files. `gsk_` was in the
        #      ORIGINAL pattern list — the key was invisible for months purely
        #      because of the path exclusion, exactly like the Gemini ones.
        #      That is now seven credential files found where the audit cited one.
        #   b. `git grep -E "-----BEGIN…"` parses the leading dashes as options.
        #      The pattern silently errored instead of scanning. Every pattern is
        #      now passed with `-e`.
        #   c. Two patterns matched prose, not secrets: a `new mysqli($DB_HOST,
        #      $DB_USER, …)` call passing VARIABLES, this file's own comment, and
        #      two audit documents quoting a redacted URI. A scanner that cries
        #      wolf gets disabled, so those are tightened to require a quoted
        #      literal rather than any following character.
        #
        # The scan runs over the WORKING TREE only. Git history is not covered —
        # tracked as TC-E4, and blocked on the purge decision in
        # doc/reference/README.md.
        run: |
          set -uo pipefail
          # Each entry must match an actual SECRET VALUE, not a mention of one.
          # The recurring false-positive shape is a variable or a doc reference,
          # so literal-quote anchors are load-bearing here.
          PATTERNS=(
            # provider API keys / private keys
            'sk-[A-Za-z0-9]{20,}'
            'AIza[0-9A-Za-z_-]{35}'
            'gsk_[A-Za-z0-9]{40,}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            'ghp_[A-Za-z0-9]{36}'
            'AKIA[0-9A-Z]{16}'
            'BEGIN [A-Z ]*PRIVATE KEY'
            # DB/SMTP credentials assigned a QUOTED LITERAL. Requiring the quote
            # is what stops `$DB_PASS` used as an argument from matching.
            '\$DB_(PASS|PASSWORD)[[:space:]]*=[[:space:]]*['"'"'"][^'"'"'"]{3,}'
            '(SMTPPassword|->Password)[[:space:]]*=[[:space:]]*['"'"'"][^'"'"'"]{3,}'
            # Passwords embedded in connection strings. The user and password
            # must both be plausible literals — `redis://[:pass@]` in a comment
            # and `***host` in an audit quote are not.
            '(postgres(ql)?|mysql|mongodb|amqp)://[A-Za-z0-9_.-]+:[A-Za-z0-9_%.!*-]{4,}@'
          )
          # Values that are obviously not real. Keep this list tight: every entry
          # is a hole, and a scanner that matches nothing is worse than none.
          # `__anything__` covers the repo's established placeholder convention
          # (__rotate_me__, __pw__, __host__, __REMOVED_ROTATE_ME__) in one rule
          # rather than a list that has to be extended every time someone coins a
          # new one. `user:pass` and friends are the shapes documentation uses
          # when it is *describing* a connection string.
          PLACEHOLDER='(__[A-Za-z_]+__|changeme|change-me|dev-[a-z-]*secret|YOUR_|example\.com|<[a-z_]+>|placeholder|xxxx|\*\*\*|user:pass|user:password|username:password)'
          FOUND=0
          for p in "${PATTERNS[@]}"; do
            # -e is REQUIRED: a pattern starting with '-' is otherwise parsed as
            # an option and the scan silently does nothing.
            HITS="$(git grep -nIE -e "$p" -- . \
                      ':!*.lock' ':!package-lock.json' \
                      ':!**/vendor/**' ':!**/node_modules/**' \
                      ':!.github/workflows/ci.yaml' \
                      ':!doc/*_AUDIT_*.md' ':!doc/reference/README.md' \
                    | grep -vEi "$PLACEHOLDER" || true)"
            if [ -n "$HITS" ]; then
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Possible secret committed — rotate it at the provider, THEN remove it. Deleting the file is not the fix."
            exit 1
          fi
          echo "No secret patterns found."

  frontend:
    # The client and platform-console were never built in CI, so a FE type error
    # or broken import could merge green. Both have their own toolchain (and, as
    # of session 15, their own ESLint flat config), hence a separate job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, platform-console]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # TC-CI8: `ci`, not `install`. See the root install step — the
        # Windows-lockfile concern does not hold for lockfileVersion 3.
        run: npm ci --no-audit --no-fund --prefix ${{ matrix.app }}

      - name: Install root dependencies (for packages/shared)
        # The client imports packages/shared, the CommonJS Zod schemas the API
        # validates with. Node resolves that package's `require("zod")` from the
        # repo root, so a client-only install leaves it unresolvable and every
        # shared-schema import fails. Installing zod INTO packages/shared would
        # fix resolution by creating a second Zod instance, which breaks
        # `instanceof` across the FE/BE boundary — so the root copy is the one
        # both halves point at (see the alias in client/vite.config.ts).
        if: matrix.app == 'client'
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --prefix ${{ matrix.app }}

      - name: Design-token contrast
        # Asserts every text-on-surface token pair clears WCAG 2.1 AA. Six pairs
        # failed before Phase 1 — most visibly `.micro` at 3.01:1, used 198x
        # across 54 files. Client only; the platform console has no token file.
        if: matrix.app == 'client'
        run: npm run check:contrast --prefix client

      - name: Frontend guide is not lying
        # Phase 5, closing F5 — the audit's ROOT-CAUSE finding. The onboarding
        # doc told every new engineer to use <ResourceList> and <CrudResource>:
        # one had been deleted, the other had zero call sites. The audit's words:
        # "there is no paved road, so 24 feature areas each paved their own."
        #
        # Phase 1 corrected the document. Nothing stopped it drifting again, and
        # being wrong cost nothing, which is why it stayed wrong for months. This
        # fails the build if doc/FRONTEND_GUIDE.md names a component that is not
        # a real export, and if a superseded frontend doc loses the banner
        # pointing at the guide.
        if: matrix.app == 'client'
        run: npm run check:docs --prefix client

      - name: Motion budget
        # Phase 5. F17's sharpest finding was `.animate-fade-up` running 500ms on
        # every card and table mount — a dispatcher opening the shipments view
        # forty times a day waited twenty seconds a day for a decoration, and it
        # made a fast backend look slow. Phase 1 took it to 120ms.
        #
        # Nothing stopped it coming back. A 500ms fade is one character away from
        # a 50ms one, it looks fine in a screenshot and fine in review, and the
        # person who notices is the operator on their three-hundredth use. Same
        # argument as the palette gate: a rule nobody can check is a rule.
        #
        # It also asserts the prefers-reduced-motion umbrella still covers both
        # animation AND transition, and still reaches pseudo-elements — one
        # dropped `!important` silently un-honours a platform preference.
        if: matrix.app == 'client'
        run: npm run check:motion --prefix client

      - name: Raw-palette gate
        # Phase 4 deliverable: "Zero raw-palette colours". The audit measured 122
        # `text-emerald-600`-style literals against a design rule (#1: "never
        # hardcode colours") that nothing enforced. Each one breaks tenant
        # white-labelling — it stays that hue when the tenant's brand is teal,
        # which is exactly the class of defect the Phase 3 smoke test caught in
        # production (Addendum 6: a tenant-tinted pill ground with SmartLS-brown
        # text on it, an unmeasured contrast pair).
        #
        # 122 → 56 (Phase 2) → 46 (Phase 3) → 0 here. This is what keeps it at 0.
        # A plain script rather than a lint rule because the largest single source
        # was a lookup TABLE of class strings, not a JSX attribute — an AST rule
        # reading className would have missed the one that mattered most.
        if: matrix.app == 'client'
        run: npm run check:palette --prefix client

      - name: Test
        # The client had zero tests until Phase 1 PR2 (audit F15) while the
        # backend carried ~50 suites — on a frontend that drives journal entries,
        # payroll runs and God-Mode purges. `--if-present` so platform-console
        # (which still has no suite) does not fail the matrix.
        run: npm run test --if-present --prefix ${{ matrix.app }}

      - name: Build
        run: npm run build --prefix ${{ matrix.app }}

      - name: Shared schema package
        # packages/shared was written, tested and merged without a single routed
        # screen importing it, so it was tree-shaken out of every build and NO
        # build ever compiled it. It passed its Vitest suite throughout — Vitest
        # loads that CommonJS through Node, not through Rollup, so the two paths
        # never agreed and only one was exercised. Pulling it into a build for
        # the first time failed three ways: no named exports (commonjsOptions
        # does not cover source outside node_modules), an ENOENT on the
        # repo-root zod the Docker clientbuild stage does not have, and — once
        # both were fixed — two different Zod instances, because zod ships
        # separate ESM and CJS entries and the alias pointed at the directory.
        #
        # This builds a probe entry against the real vite.config.ts and asserts
        # the schemas resolve, parse, and share ONE Zod. Client only.
        if: matrix.app == 'client'
        run: npm run check:shared --prefix client

      - name: Install Chromium for the layout gate
        # Only the browser, and only for the client. `--with-deps` pulls the
        # shared libraries headless Chromium needs on a bare runner; the version
        # is pinned by @playwright/test in package.json (exact, not caret) so the
        # browser and the runner cannot drift apart between builds.
        if: matrix.app == 'client'
        run: npm run e2e:install --prefix client

      - name: Desktop layout gate
        # Phase 5. Phases 3 and 4 BOTH measured the app in a real browser at
        # 1280/1440/1920/2560 and BOTH threw the harness away, deferring "stand
        # it up in CI" to the next phase. This is that harness.
        #
        # It asserts NUMBERS, not pixels, and that is deliberate. A committed
        # screenshot baseline differs between this runner and a developer's
        # machine on font hinting alone, so its first run is red for a reason
        # nobody can act on — and this repo has already written down what happens
        # to a gate like that. What actually regressed in the findings this audit
        # is about was never a pixel: it was a content column that would not grow
        # past 1152px, a row 46px tall instead of 32, a page that scrolled
        # sideways. Those are deterministic across platforms.
        #
        # It earned its place immediately: it found that the density work from
        # Phase 1 had never landed on a real list screen. Rows measured 49px
        # however small the padding was, because `<Button size="sm">` is 36px and
        # 67 screens put one in the actions column. Invisible to jsdom (no layout
        # engine) and not what the Phase 3/4 runs measured.
        if: matrix.app == 'client'
        run: npm run test:e2e --prefix client

      - name: Upload layout-gate report
        # Screenshots and traces are EVIDENCE, not the assertion — they exist so
        # a human can see what a failed measurement looked like.
        if: ${{ failure() && matrix.app == 'client' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

      - name: Shared schemas are actually shared
        # check:shared proves the package RESOLVES and gives both halves one Zod
        # instance. It cannot see the failure this catches, which is
        # organisational: a schema lands in packages/shared, one side imports it,
        # and the other keeps its own copy — so there are now THREE definitions
        # instead of two. packages/shared existed for two phases with exactly one
        # domain in it and nothing anywhere said so.
        #
        # It also fails if a migrated validator declares a `z.object` again. A
        # migrated validator is an adapter; a schema in it means a rule was added
        # on one side only, which is the drift the package exists to stop.
        if: matrix.app == 'client'
        run: npm run check:schemas --prefix client

      - name: Bundle graph
        # The 2026-08-04 blank page: `manualChunks` split `vendor-react` out of
        # `vendor`, but react-dom needs `scheduler` and react-router-dom needs
        # `@remix-run/router` — both of which stayed in `vendor`. The two chunks
        # imported each other, one read the other's React binding before it was
        # assigned, and TanStack Query's top-level createContext threw on
        # `undefined`. That happens during module evaluation, before React
        # renders, so no ErrorBoundary caught it: smartls.praxisls.com served an
        # empty <div id="root">.
        #
        # Rollup DID warn ("Circular chunk: vendor -> vendor-react -> vendor")
        # and this job went green anyway, because a warning is not a gate.
        # vite.config.ts now throws on that warning; this step re-derives the
        # graph from what was actually written to dist/ and fails on any cycle
        # the bundler did not report. Client only — platform-console has no
        # manual chunking.
        if: matrix.app == 'client'
        run: npm run check:bundle --prefix client

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        # Catches Dockerfile breakage without needing a registry. Builds the
        # runtime stage; the worker stage shares the same base.
        run: docker build --target runtime -t praxis-ls:ci .

      - name: Start the image and wait for liveness
        # TC-CI7. The image was BUILT and never STARTED, so any failure between
        # `docker build` succeeding and the process serving traffic reached
        # production untouched — a missing runtime dependency, a bad CMD, a
        # module that throws at require time.
        #
        # That is not hypothetical here. The Dockerfile's deps stage did not
        # copy packages/, so the image shipped with @praxis/shared unresolvable
        # and NO INVOICING MODULE. It built perfectly. Nothing before the deploy
        # would have caught it.
        #
        # Liveness only: /api/health deliberately touches no dependency, so this
        # asks the one question a container without a database can answer — did
        # the process come up and start serving. Readiness needs Postgres and
        # Redis and belongs in the migrations job's world, not here.
        run: |
          set -euo pipefail
          # NODE_ENV=production is the point — it is the mode that ships, and
          # env.js refuses to boot in it with default or duplicated secrets.
          # These are throwaway CI values chosen to satisfy that guard: distinct
          # access/refresh secrets, and an ENCRYPTION_KEY that is valid hex but
          # is NOT the dev default the guard rejects. Nothing here decrypts
          # anything real; the container never reaches a database.
          #
          # DB_PASSWORD is in the list because the guard grew a
          # `!DB_PASSWORD -> DB_PASSWORD_empty` check after this step was
          # written, and the step was never updated — so the smoke test failed
          # on the guard rather than on the image. A non-empty value is all it
          # wants; liveness (/api/health) touches no dependency, so nothing
          # connects anywhere.
          docker run -d --name praxis-ci \
            -e NODE_ENV=production \
            -e LOG_LEVEL=warn \
            -e PORT=8080 \
            -e JWT_ACCESS_SECRET=ci_access_a1b2c3d4e5f6a7b8c9d0e1f2 \
            -e JWT_REFRESH_SECRET=ci_refresh_9f8e7d6c5b4a39281706f5e4 \
            -e ENCRYPTION_KEY=7c4a8d09ca3762af61e59520943dc26494f8941b7c4a8d09ca3762af61e59520 \
            -e DB_PASSWORD=ci-only-not-a-secret \
            -p 8080:8080 praxis-ls:ci

          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/live.json -w '%{http_code}' http://localhost:8080/api/health || true)
            if [ "$code" = "200" ]; then
              echo "Container is serving after ${i}s:"
              cat /tmp/live.json
              exit 0
            fi
            sleep 1
          done

          echo "::error::The built image never served /api/health within 30s."
          echo "--- container logs ---"
          docker logs praxis-ci 2>&1 | tail -80
          exit 1

      - name: Every module mounts inside the image
        # The invoicing-module incident again, stated as an assertion. A module
        # that fails to require is SKIPPED by the loader, not fatal — by design,
        # so one bad module cannot take the API down — which means the only
        # evidence is this field. Empty is the only acceptable value.
        run: |
          set -euo pipefail
          skipped=$(docker exec -w /app praxis-ci node -e "
            const express = require('express');
            const { mountTenantModules, mountReport } = require('./src/shared/http/module-loader');
            mountTenantModules(express.Router());
            const r = mountReport();
            console.log(JSON.stringify({ mounted: r.mounted.length, skipped: r.skipped }));
          ")
          echo "$skipped"
          if [ "$(echo "$skipped" | jq '.skipped | length')" != "0" ]; then
            echo "::error::Modules failed to mount inside the built image."
            echo "$skipped" | jq .skipped
            exit 1
          fi

      - name: Container logs and teardown
        if: always()
        run: |
          docker logs praxis-ci 2>&1 | tail -50 || true
          docker rm -f praxis-ci || true
