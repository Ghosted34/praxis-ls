<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      PRE-PAINT THEME — DARK, LOCKED.

      `lib/theme-mode.ts` owns the decision and this is its twin: the module is
      `type="module"` and therefore DEFERRED, so the browser paints the first
      frame before any module has executed. Anything this script does not write
      is a frame the visitor sees in the wrong theme.

      LOCKED TO DARK. `FORCE_DARK` in lib/theme-mode.ts is the switch; this is
      the copy of it that has to run without an import. Storage is not read at
      all while the lock is on, which is deliberate — a visitor who picked light
      before the lock landed still gets dark, and there is no toggle rendered to
      pick it again with. To restore the toggle: set `FORCE_DARK = false` there
      and put the `localStorage` read below back. `theme-mode.test.ts` reads
      this file and fails if the two sides disagree.

      Dark is also the DEFAULT under that restored read, not light. Both signals
      are written, not just the class: `.dark` drives THIS app's token block,
      but `@praxis/brand/tokens.css` follows `prefers-color-scheme` unless
      `data-theme` opts out of it. Writing only the class left a dark-OS visitor
      with dark BRAND tokens — orange stepped for carbon — under light APP
      tokens, on white, for every frame before main.tsx ran.
    -->
    <script>
      (function () {
        // Locked. Unlock by restoring:
        //   var mode = "dark";
        //   try { if (localStorage.getItem("praxis.public.theme") === "light") mode = "light"; } catch (e) {}
        var mode = "dark";
        var el = document.documentElement;
        el.classList.add("dark");
        el.classList.remove("light");
        el.setAttribute("data-theme", mode);
        // Native UI — scrollbars, form controls, the canvas painted before the
        // stylesheet lands — follows this and nothing else. Without it a dark
        // page keeps a white scrollbar and a white flash on first paint.
        el.style.colorScheme = mode;
      })();
    </script>
    <!--
      WHERE THIS APP'S MARKETING PAGES LIVE, on this host.

      The prefix is a per-host setting (`platform.subdomain.public_base`, edited
      in the platform console) and `src/shared/http/public-head.js` REPLACES this
      tag per request. What is here is the default, and it is what `vite dev` and
      `vite preview` read, since neither goes through that rewrite.

      `lib/base-path.ts` reads it once at boot and every link is built from it.
      `/portal` is not affected and never moves.
    -->
    <meta name="praxis:public-base" content="/public" />
    <!-- One value, no `media`: the app is locked to dark (see the script above),
         so a light `theme-color` would tint the phone's browser chrome white
         above a carbon page. Matches `--background` in the dark token block. -->
    <meta name="theme-color" content="#0b0d11" />
    <!--
      Title, description and the favicon are tenant-owned and are set at runtime
      from GET /branding (app/branding.tsx). What is here is the fallback for the
      frame before that fetch resolves — and for a route with no tenant, which is
      what a crawler sees first.
    -->
    <title>Praxis</title>
    <meta
      name="description"
      content="Freight, customs clearance, warehousing and hinterland transport — with shipment tracking, a client portal and a quote desk."
    />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font: 16px/1.6 system-ui, sans-serif">
        <p>
          This site needs JavaScript for tracking, quotes and the client
          portal. To track a shipment or request a quote right now, contact us
          by phone or email and we will handle it from there.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
